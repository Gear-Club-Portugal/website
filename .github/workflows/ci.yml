name: CI

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  lint-and-format:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable

      - name: Create stub data files
        run: |
          for f in banners events awards pages posts; do
            echo '{}' > src/assets/data/$f.json
          done

      - name: Lint
        run: yarn lint

      - name: Format check
        run: yarn format:check
